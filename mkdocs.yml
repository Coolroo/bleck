site_name: bleck
site_description: A modding toolkit for Super Paper Mario (Wii)
site_url: https://coolroo.github.io/bleck/
repo_url: https://github.com/Coolroo/bleck
repo_name: Coolroo/bleck
edit_uri: edit/main/docs-site/
copyright: Super Paper Mario is a trademark of Nintendo. This project is unaffiliated.

# ⚠️ MUST be explicit. MkDocs defaults `docs_dir` to `docs/`, which in this
# repository is the internal design record — decision log, handoff notes,
# unreleased research. Publishing that to the public web would be a mistake
# nobody would notice until it was indexed.
docs_dir: docs-site
site_dir: work/site

theme:
  name: material
  favicon: favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    # Picking "Windows" in one tab set selects it in every other set on the
    # page, which matters here because most pages show all three platforms.
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Without this, an icon shortcode like `:material-linux:` renders as its own
  # literal text rather than an icon.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Get started:
      - index.md
      - Quickstart: quickstart.md
  - Installation:
      - install/index.md
      - Linux: install/linux.md
      - macOS: install/macos.md
      - Windows: install/windows.md
  - Concepts:
      - Pipeline: concepts/pipeline.md
      - Mods: concepts/mods.md
      - Dependencies: concepts/dependencies.md
      - Disc formats: concepts/disc-formats.md
  - Language:
      - language/index.md
      - Syntax: language/syntax.md
      - Storage: language/storage.md
      - Attributes: language/attributes.md
      - Built-in functions: language/builtins.md
  - Guides:
      - Your first mod: guides/first-mod.md
      - Scripting: guides/scripting.md
      - Testing: guides/testing.md
      - Code mods: guides/code-mods.md
      - Running on a Wii: guides/hardware.md
      - JSON API: guides/json-api.md
  - Findings:
      - findings/index.md
      - How these were measured: findings/method.md
      - Reproducing these findings: findings/reproducing.md
      - The evt VM:
          - Scripts need END_EVT: findings/evt-script-end.md
          - Instruction encoding: findings/evt-instruction-format.md
          - Door setter argc (header bug): findings/evt-door-argc.md
      - Game data:
          - Door descriptors: findings/door-descriptors.md
          - npcEnemyTemplates: findings/npc-enemy-templates.md
          - itemEventDataTable: findings/item-event-data-table.md
          - itemDataTable: findings/item-data-table.md
          - Message files: findings/msg-file-format.md
          - Setup file format: findings/setup-file-format.md
          - Which setup copy is read: findings/setup-which-copy.md
          - Placed items and the coin-flag budget: findings/setup-items.md
      - Code and formats:
          - Patching PowerPC code: findings/ppc-code-patching.md
          - Tracing a function: findings/function-tracing.md
          - Four functions measured: findings/undocumented-functions.md
          - Symbol list errors: findings/symbol-list-errors.md
          - LZ77 need not be exact: findings/lz77-not-bit-exact.md
      - Testing the game:
          - An unattended boot: findings/attract-demo.md
          - Pouch and save slots: findings/player-session.md
  - Reference:
      - CLI: reference/cli.md
      - Manifest: reference/manifest.md
      - Environment: reference/environment.md
  - Contributing:
      - Dev setup: contributing/dev-setup.md
      - Standards: contributing/standards.md
