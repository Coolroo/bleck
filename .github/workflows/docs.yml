name: docs

# Builds the user-facing site and publishes it to GitHub Pages.
#
# Pull requests build but do not deploy, so a broken link fails review rather
# than reaching the published site. `--strict` is what makes that meaningful:
# it turns MkDocs' broken-link warnings into a non-zero exit.
#
# ⚠️ This publishes `docs-site/`, never `docs/`. The split is enforced by
# `docs_dir` in mkdocs.yml — see the warning there. `docs/` is the internal
# design record and must not be indexed.

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - "bleck/script/catalog.json"
      - "bleck/script/evt.py"
      - "scripts/dump_builtins.py"
  pull_request:
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
  workflow_dispatch:

# The default GITHUB_TOKEN has neither of the last two; without them
# `deploy-pages` fails with a permissions error that does not name the cause.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the generated reference is current
        # scripting/builtins.md and scripting/storage.md are generated from
        # catalog.json and bleck/script/evt.py. A stale reference is worse than
        # none, because it is believed -- so a catalog change that was not
        # followed by a regeneration fails here.
        run: uv run python scripts/dump_builtins.py --check

      - name: Build the site
        # --strict fails on broken internal links, so a bad cross-reference is
        # caught here rather than by a reader.
        run: uv run --extra docs mkdocs build --strict

      # ⚠️ Pages must already be enabled by hand: Settings -> Pages -> Source
      # -> GitHub Actions. This step's `enablement: true` option cannot do it
      # for you — the default GITHUB_TOKEN lacks repo-admin rights and the call
      # fails with "Resource not accessible by integration", which errors
      # rather than warning and takes the whole job down with it.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Matches `site_dir` in mkdocs.yml.
          path: work/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
