# Dimentio is built and linted on its own, never as part of `bleck`'s CI.
# A contributor with no interest in it must not need a Rust toolchain, and the
# Python suite must keep passing on a machine that has none (docs/plan-dimentio.md).
name: dimentio

on:
  push:
    paths:
      - "dimentio/**"
      - ".github/workflows/dimentio.yml"
  pull_request:
    paths:
      - "dimentio/**"
      - ".github/workflows/dimentio.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dimentio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dimentio

      # eframe needs X11/Wayland development headers on Linux; the other two
      # platforms ship their graphics stack.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
