[project]
name = "spm-modkit"
version = "0.1.0"
description = "Modding toolkit for Super Paper Mario (Wii)"
requires-python = ">=3.10"
dependencies = [
    # The one runtime dependency, spent on `bleck.yml` (see docs/plan-config.md).
    # YAML is not a format worth hand-rolling: `.env`'s parser is safe because
    # its whole grammar is `KEY=VALUE`, and YAML's is not that.
    "pyyaml>=6.0",
    # The JSON contract other applications integrate against: validation,
    # serialisation and a published schema from one set of declarations.
    # A GUI cannot shell out to `bleck mod build` per keystroke, so this
    # boundary has to be a real API rather than CLI output (docs/vision.md).
    "pydantic>=2.7",
]

[project.scripts]
bleck = "bleck.cli.app:main"

# Keep the runtime dependency list as short as practical — this is a toolkit
# people install to use, not a library. It was empty until `bleck.yml` landed.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pylint>=3.2",
    # Cross-check oracle for LZ77/U8, not used at runtime — see D16.
    "libWiiPy>=0.6.0",
    # ELF -> REL conversion. Dev-only today; becomes a runtime dependency when
    # code mods land (see docs/code-mods.md).
    "pyelf2rel>=1.0.9",
    # Reads Dolphin's emulated memory from outside the process, which is what
    # makes in-game verification automatic. Three rounds of asking a human to
    # watch a screen produced two wrong conclusions; this settled the same
    # question in four unattended runs (D43).
    "dolphin-memory-engine>=1.3",
    # pylint cannot see through pydantic's descriptors and reports every
    # model field as a FieldInfo with no members. Teaching it beats
    # scattering `# pylint: disable=no-member` as the API grows.
    "pylint-pydantic>=0.3",
]

# Building the single-file executable. Separate from `dev` so a contributor
# running the tests does not pull in a packaging toolchain.
build = [
    "pyinstaller>=6.6",
]

# Separate from `dev` so that editing prose does not pull in a test and lint
# toolchain, and so CI can install only what a docs build needs.
docs = [
    "mkdocs-material>=9.7",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade — modern syntax
    "B",         # bugbear — likely bugs
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # return-statement clarity
    "PTH",       # prefer pathlib over os.path
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RET504",  # a named variable before return often documents intent
    "B008",    # argparse and dataclass idioms rely on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately poke at internals and use fixtures as arguments.
"tests/*" = ["ARG001", "ARG002"]

[tool.pylint.main]
load-plugins = [
    "lint_plugins.container_returns",
    "lint_plugins.env_access",
    "pylint_pydantic",
]
ignore-paths = ["\\.venv", "build", "dist"]
# Must stay 1: with jobs > 1 pylint loads custom plugins once per worker and
# every plugin message is reported twice. Verified on pylint 4.0.6.
jobs = 1
# Plugins live in the repo, so the repo root must be importable.
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",     # covered by review, not worth failing on
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",       # dataclasses are the point of this project
    "duplicate-code",               # noisy across command modules
    "fixme",
    # Requesting a pytest fixture shadows its name by design; this fires on
    # every fixture-using test and flags nothing real.
    "redefined-outer-name",
]

[tool.pylint.format]
max-line-length = 90

[tool.pylint.design]
max-args = 6
max-locals = 18
max-returns = 8   # annotation dispatch legitimately branches a lot
max-attributes = 12   # manifests and reports are wide by nature

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repo root importable so tests can share helpers via `tests.*`.
# Without this the suite only runs under `python -m pytest`, which happens to
# put the CWD on sys.path; `uv run pytest` and a bare `pytest` would not.
pythonpath = ["."]
# `slow` compresses real game data and takes minutes on a Pi — opt in with
# `-m slow`. Everything else must stay fast enough to run on every change.
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bleck*"]
